name: Publish SDKs

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, build but skip publishing'
        required: false
        default: 'false'

jobs:
  typescript:
    name: Publish @crayonz-ai/sdk
    runs-on: ubuntu-latest
    permissions:
      # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11+, which has the OIDC Trusted Publisher
          # client. Node 20 (npm 10) signs provenance via OIDC but doesn't
          # use OIDC for the registry PUT, hence 404. Per npm docs:
          # https://docs.npmjs.com/trusted-publishers#supported-cicd-providers
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install + build
        working-directory: typescript
        run: |
          npm install
          npm run build
          npm run typecheck
      - name: Show package contents
        working-directory: typescript
        run: npm pack --dry-run
      - name: Publish to npm (via Trusted Publishing OIDC)
        if: ${{ github.event_name == 'push' || inputs.dry_run != 'true' }}
        working-directory: typescript
        run: npm publish --access public
        # --provenance is implied automatically by npm 11 when OIDC is
        # active. No NODE_AUTH_TOKEN — pure OIDC.

  python:
    name: Publish crayonz
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no PYPI_TOKEN secret needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install --upgrade build twine
      - name: Build wheel + sdist
        working-directory: python
        run: python -m build
      - name: Twine check
        working-directory: python
        run: twine check dist/*
      - name: Publish to PyPI (via Trusted Publishing OIDC)
        if: ${{ github.event_name == 'push' || inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
        # No password: — pypa/gh-action-pypi-publish auto-detects the
        # OIDC Trusted Publisher configured at pypi.org/manage/project/crayonz/
        # settings/publishing/. Setting `password` would override OIDC.
