[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "crayonz"
version = "0.2.0"
description = "Official Python SDK for the Crayonz AI API — print-ready AI design generation, garment mockups, model/product photoshoots, and virtual try-on."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Aivolvix Technologies", email = "support@crayonz.ai" }
]
keywords = ["crayonz", "ai", "design-generation", "print-on-demand", "virtual-try-on", "mockups"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.25",
  "typing-extensions>=4.5; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "respx>=0.21"]

[project.urls]
Homepage = "https://crayonz.ai/api-console"
Documentation = "https://crayonz.ai/api-console/docs"
Source = "https://github.com/iitian-vibes/crayonz-sdks"
Issues = "https://github.com/iitian-vibes/crayonz-sdks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crayonz"]

[tool.hatch.build.targets.sdist]
include = [
  "src/crayonz",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
